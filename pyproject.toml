[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyscrape"
version = "0.2.0"
description = "Altı platformun videolarını belirlenen servislerle seçilen klasöre indirir"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.51.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.3",
    "mypy>=1.8.0",
    "pytest>=7.4.4",
    "ruff>=0.2.1",
]

[project.scripts]
easyscrape = "easyscrape.cli:main"

[project.gui-scripts]
easyscrape-gui = "easyscrape.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/easyscrape"]
strict = true
show_error_codes = true
